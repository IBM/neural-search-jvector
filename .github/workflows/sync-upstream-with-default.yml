name: Sync Upstream With Default

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: jvector_main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/opensearch-project/neural-search.git || true
          git fetch upstream main

      - name: Step 1 - Create sync branch from main
        id: create_branch
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git fetch upstream main:main
          git reset --hard main

      - name: Step 2 - Create Pull Request to jvector_main
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PR_TOKEN }}
          branch: ${{ steps.create_branch.outputs.branch_name }}
          base: jvector_main
          title: "Sync Upstream main to jvector_main"
          labels: autocut
          delete-branch: true
          push-to-fork: ibm-jeeves/neural-search-jvector
          author: IBM-jeeves <bot@ibm.com>
          committer: IBM-jeeves <bot@ibm.com>
          signoff: true
          body: |
            ## Weekly Upstream Sync

            This PR syncs changes from upstream/main into jvector_main.

            ### Process

            Step 1: Created sync branch from `upstream/main`

            ### Review Required

            Please review the changes carefully as jvector_main contains additional modifications for the jvector plugin that may conflict with upstream changes.

            ### Checklist

            - [ ] Review all changes for conflicts
            - [ ] Verify jvector-specific changes are preserved
            - [ ] Run tests to ensure compatibility
            - [ ] Update documentation if needed

            ### Sync Details

            - **Source**: `upstream/main`
            - **Target**: `jvector_main`
            - **Triggered by**: ${{ github.event_name }}

            ---

            *This PR was automatically created by the Sync Upstream With Default workflow.*
